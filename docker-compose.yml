services:
  jupyter:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oe-itseclabs-jupyter
    ports:
      - "8888:8888"
    volumes:
      - ./:/home/hallgato/oe-itseclabs
    working_dir: /home/hallgato/oe-itseclabs
    command: jupyter lab --ip 0.0.0.0 --port 8888 --no-browser
